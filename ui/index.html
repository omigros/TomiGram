<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none';"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#edeef0"><title>TomiGram</title><link rel="stylesheet" href="./styles.css"></head>
<body data-theme="light"><div class="window-shell">
<header class="titlebar"><div class="window-brand"><img src="../assets/tomigram-tray.png" alt=""><span>TomiGram</span></div><div class="drag-region"></div><div class="window-controls"><button class="window-control minimize" aria-label="Свернуть">−</button><button class="window-control maximize" aria-label="Развернуть">□</button><button class="window-control close" aria-label="Закрыть">×</button></div></header>
<header class="topbar"><div class="brand"><span class="brand-mark">T</span><span>TomiGram</span></div><nav class="switcher" aria-label="Выбор мессенджера"><button class="messenger active" data-messenger="telegram" aria-pressed="true"><span class="telegram-icon">➤</span><span>Telegram</span></button><button class="messenger" data-messenger="vk" aria-pressed="false"><span class="vk-icon">ᴠκ</span><span>ВКонтакте</span></button></nav><div class="topbar-spacer"></div><button class="settings-toggle" id="settings-toggle" aria-label="Настройки">⚙</button><span class="status"><i></i> Раздельные сессии</span></header>
<section class="settings-panel" id="settings-panel" hidden><div class="settings-heading">Цветовая схема</div><div class="theme-options"><button data-theme-choice="light" class="theme-choice"><span class="theme-preview light-preview"></span>VK Светлая</button><button data-theme-choice="dark" class="theme-choice"><span class="theme-preview dark-preview"></span>VK Тёмная</button></div></section>
<main class="stage"><div class="transition-layer" aria-hidden="true"></div><div class="loading-note">Подключение к мессенджеру…</div></main></div><script src="./renderer.js"></script></body></html>
